<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLR Exercise 8 — reference diagnostics</title>
<style>
 body{font:16px/1.45 system-ui,Arial,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;color:#142c20;background:#f4f7f3}
 button{font:inherit;padding:12px 18px;border:0;border-radius:9px;background:#245d40;color:white}
 pre{overflow-wrap:anywhere;white-space:pre-wrap;background:white;border:1px solid #ddd;border-radius:10px;padding:16px;font-size:13px}
 .muted{color:#586b5e} img{width:96px;height:96px;image-rendering:pixelated}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
</head>
<body>
<h1>Task 2 · reference diagnostics</h1>
<p class="muted">Diagnostic only: uses the original model, check_image.jpg and notebook reference probabilities. No photo is uploaded. Keep the existing app unchanged.</p>
<button id="run" disabled>Run diagnostic</button> <button id="copy" disabled>Copy results</button>
<p id="status">Loading runtime…</p>
<img id="reference" alt="Original reference image" src="./check_image.jpg">
<pre id="output">No results yet.</pre>
<script>
'use strict';
const runtimeUrl='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
const $=id=>document.getElementById(id);
function hashBytes(bytes){
  let h=2166136261>>>0;
  for(let i=0;i<bytes.length;i++){
    h=Math.imul(h ^ bytes[i],16777619)>>>0;
  }
  return h.toString(16).padStart(8,'0');
}
function softmax(logits){
  const maximum=Math.max(...logits);
  const exps=Array.from(logits,x=>Math.exp(x-maximum));
  const sum=exps.reduce((a,b)=>a+b,0);
  return exps.map(x=>x/sum);
}
function loadedImage(img){
  return new Promise((resolve,reject)=>{
    if(img.complete && img.naturalWidth){resolve();return;}
    img.onload=resolve;
    img.onerror=()=>reject(new Error('Failed to load check_image.jpg'));
  });
}
async function run(){
  $('run').disabled=true;$('copy').disabled=true;
  $('status').textContent='Running reference diagnostic…';
  try{
    const [infoRes,expectedRes]=await Promise.all([fetch('./model_info.json'),fetch('./check_expected.json')]);
    if(!infoRes.ok||!expectedRes.ok)throw new Error('Missing model_info.json or check_expected.json');
    const info=await infoRes.json(),expected=await expectedRes.json();
    await loadedImage($('reference'));
    const img=$('reference'),width=img.naturalWidth,height=img.naturalHeight;
    const size=info.input_size,side=Math.min(width,height);
    const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
    const context=canvas.getContext('2d',{willReadFrequently:true});
    context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';
    // Exact same preprocessing steps as the deployed Task 2 index.html.
    context.drawImage(img,(width-side)/2,(height-side)/2,side,side,0,0,size,size);
    const rgba=context.getImageData(0,0,size,size).data,plane=size*size;
    const input=new Float32Array(3*plane);
    const sums=[0,0,0];
    for(let c=0;c<3;c++)for(let p=0;p<plane;p++){
      const raw=rgba[p*4+c];sums[c]+=raw;
      input[c*plane+p]=(raw/255-info.mean[c])/info.std[c];
    }
    const sampleLocations=[0,1,12,100,512,4096,9215];
    const rgbaSamples=sampleLocations.filter(i=>i<plane).map(i=>({pixel:i,rgba:Array.from(rgba.slice(i*4,i*4+4))}));
    const tensorSamples=[0,1,100,512,4096,9215,plane,plane+100,2*plane,2*plane+100].filter(i=>i<input.length).map(i=>({index:i,value:input[i]}));
    const rawInputBytes=new Uint8Array(input.buffer);
    ort.env.wasm.numThreads=1;
    ort.env.wasm.wasmPaths=runtimeUrl;
    const session=await ort.InferenceSession.create('./leaf_model.onnx',{executionProviders:['wasm']});
    const tensor=new ort.Tensor('float32',input,[1,3,size,size]);
    let output;
    try{output=await session.run({[session.inputNames[0]]:tensor});}
    finally{tensor.dispose();}
    let logits;
    try{logits=Array.from(output[session.outputNames[0]].data);}
    finally{Object.values(output).forEach(x=>x.dispose());}
    const probabilities=softmax(logits);
    const comparison=info.classes.map((name,i)=>({name,actual:probabilities[i],expected:expected[name],absoluteError:Math.abs(probabilities[i]-expected[name])}));
    const maxError=Math.max(...comparison.map(r=>r.absoluteError));
    const diagnostic={
      url:location.href,
      userAgent:navigator.userAgent,
      referenceImage:{width,height},
      inputSize:size,
      modelClasses:info.classes,
      channelPixelSumsRGB:sums,
      rgbaFnv1aHash:hashBytes(rgba),
      tensorFnv1aHash:hashBytes(rawInputBytes),
      rgbaSamples,tensorSamples,
      logits,comparison,
      maximumError:maxError,
      pass:maxError<=0.0001
    };
    $('output').textContent=JSON.stringify(diagnostic,null,2);
    $('status').textContent=diagnostic.pass?'PASS – see diagnostic values':'FAIL – see diagnostic values';
    $('copy').disabled=false;
  }catch(error){$('status').textContent='Diagnostic failed';$('output').textContent=String(error.stack||error);}
  finally{$('run').disabled=false;}
}
window.addEventListener('DOMContentLoaded',()=>{
  $('run').disabled=false;
  $('run').addEventListener('click',run);
  $('copy').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText($('output').textContent);$('status').textContent+=' · Copied';}
    catch(error){$('status').textContent+=' · Copy unavailable; take a screenshot instead';}
  });
});
</script>
</body>
</html>
